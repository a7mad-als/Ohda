openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: payments
    description: Test payment operations
paths:
  /tap/config:
    get:
      operationId: getTapPaymentConfig
      tags: [payments]
      summary: Get public Tap test configuration
      responses:
        "200":
          description: Tap configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TapPaymentConfig"
  /tap/authorizations:
    post:
      operationId: createTapAuthorization
      tags: [payments]
      summary: Create a test Tap authorization hold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TapAuthorizationInput"
      responses:
        "201":
          description: Authorization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TapAuthorizationReceipt"
        "400":
          description: Invalid payment input
        "503":
          description: Tap test credentials unavailable
        "502":
          description: Tap could not create the authorization
  /tap/authorizations/{id}:
    get:
      operationId: getTapAuthorization
      tags: [payments]
      summary: Verify a Tap test authorization status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^auth_[A-Za-z0-9]+$"
      responses:
        "200":
          description: Verified authorization status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TapAuthorizationStatus"
        "400":
          description: Invalid authorization ID
        "404":
          description: Authorization not found
        "503":
          description: Tap test credentials unavailable
        "502":
          description: Tap status could not be verified
  /stripe/config:
    get:
      operationId: getStripePaymentConfig
      tags: [payments]
      summary: Get public Stripe test configuration
      responses:
        "200":
          description: Stripe test configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripePaymentConfig"
  /stripe/authorizations:
    post:
      operationId: createStripeAuthorization
      tags: [payments]
      summary: Create a USD test Stripe authorization hold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeAuthorizationInput"
      responses:
        "201":
          description: Authorization checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeAuthorizationReceipt"
        "400":
          description: Invalid payment input
        "503":
          description: Stripe test credentials unavailable
        "502":
          description: Stripe could not create the authorization
  /stripe/authorizations/{sessionId}:
    get:
      operationId: getStripeAuthorization
      tags: [payments]
      summary: Verify a Stripe test authorization status
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            pattern: "^cs_test_[A-Za-z0-9]+$"
      responses:
        "200":
          description: Verified authorization status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeAuthorizationStatus"
        "400":
          description: Invalid checkout session ID
        "404":
          description: Authorization not found
        "503":
          description: Stripe test credentials unavailable
        "502":
          description: Stripe status could not be verified
  /demo-items:
    post:
      operationId: createDemoItem
      summary: Save one demo item name to Supabase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoItemInput"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoItemReceipt"
        "400":
          description: Invalid item name
        "503":
          description: Supabase unavailable or not configured
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    TapPaymentConfig:
      type: object
      additionalProperties: false
      required: [enabled, publicKey]
      properties:
        enabled:
          type: boolean
        publicKey:
          type: ["string", "null"]
    TapAuthorizationInput:
      type: object
      additionalProperties: false
      required: [itemName, amount, tokenId, firstName, lastName, email, requestId]
      properties:
        itemName:
          type: string
          minLength: 1
          maxLength: 120
        amount:
          type: number
          minimum: 0.1
          maximum: 2000
        tokenId:
          type: string
          pattern: "^tok_[A-Za-z0-9]+$"
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
        requestId:
          type: string
          format: uuid
    TapAuthorizationReceipt:
      type: object
      additionalProperties: false
      required: [authorizationId, status, redirectUrl]
      properties:
        authorizationId:
          type: string
        status:
          type: string
        redirectUrl:
          type: ["string", "null"]
    TapAuthorizationStatus:
      type: object
      additionalProperties: false
      required: [authorizationId, status, amount, currency]
      properties:
        authorizationId:
          type: string
        status:
          type: string
        amount:
          type: number
        currency:
          type: string
    StripePaymentConfig:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
    StripeAuthorizationInput:
      type: object
      additionalProperties: false
      required: [itemName, amount, firstName, lastName, email, requestId]
      properties:
        itemName:
          type: string
          minLength: 1
          maxLength: 120
        amount:
          type: number
          minimum: 0.5
          maximum: 2000
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
        requestId:
          type: string
          format: uuid
    StripeAuthorizationReceipt:
      type: object
      additionalProperties: false
      required: [sessionId, redirectUrl]
      properties:
        sessionId:
          type: string
        redirectUrl:
          type: string
          format: uri
    StripeAuthorizationStatus:
      type: object
      additionalProperties: false
      required: [authorizationId, status, amount, currency]
      properties:
        authorizationId:
          type: string
        status:
          type: string
        amount:
          type: number
        currency:
          type: string
    DemoItemInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    DemoItemReceipt:
      type: object
      required: [saved, name]
      properties:
        saved:
          type: boolean
        name:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

